<title id="title">TinyFish integrations: high-level architecture</title>
<desc id="description">Claude, Grok, Pi, Hermes, LangChain, Google ADK, Dify, and n8n use integrations in this repository to call TinyFish hosted web tools. TinyFish accesses websites and web apps, then returns results to the agent or workflow. Available tools vary by integration.</desc>
