name: Hermes CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hermes-ci.yml"
      - "hermes/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hermes-ci.yml"
      - "hermes/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hermes

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # plugin.yaml is authoritative for X-TF-Client-Version on directory installs,
      # so pyproject.toml drifting past it ships a stale version header silently.
      - name: plugin.yaml version matches pyproject.toml
        run: |
          set -euo pipefail
          manifest=$(sed -n 's/^version:[[:space:]]*//p' plugin.yaml | head -1 | tr -d "\"' ")
          project=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "plugin.yaml=$manifest pyproject.toml=$project"
          # Both parsers are regex-based: an unparsed file yields "" on both sides
          # and would compare equal, passing the check it is meant to fail.
          if [ -z "$manifest" ] || [ -z "$project" ]; then
            echo "::error file=hermes/plugin.yaml::could not parse a version from plugin.yaml or pyproject.toml"
            exit 1
          fi
          if [ "$manifest" != "$project" ]; then
            echo "::error file=hermes/plugin.yaml::plugin.yaml is $manifest but pyproject.toml is $project"
            exit 1
          fi

      - run: python -m pip install --upgrade pip

      - run: python -m pip install -e . -r requirements-dev.txt

      - run: make lint

      - run: make test

      - run: python -m build

  e2e:
    strategy:
      fail-fast: false
      matrix:
        # Windows decodes subprocess output as cp1252, which broke `tinyfish setup` there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      # Bump deliberately: upstream Hermes moves fast and breaks plugin internals.
      HERMES_SHA: 7dab93b06e2bb3757dc18229169efcee1b5b47a3

    steps:
      # Pinned by SHA: this job receives TINYFISH_API_KEY.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install Hermes at pinned SHA
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hermes-agent"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/NousResearch/hermes-agent.git "$HERMES_SHA"
          git -C "$src" checkout -q FETCH_HEAD
          uv venv -q -p 3.14 "$RUNNER_TEMP/hvenv"
          VIRTUAL_ENV="$RUNNER_TEMP/hvenv" uv pip install -q -e "$src"
          bin="$RUNNER_TEMP/hvenv/$([ "$RUNNER_OS" = Windows ] && echo Scripts || echo bin)"
          echo "$bin" >> "$GITHUB_PATH"
          echo "HERMES_PYTHON=$bin/python" >> "$GITHUB_ENV"

      - name: Plugin e2e
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: hermes/scripts/e2e.sh
